worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Prerendered routes (/home, /login, ...) are folders with an index.html;
    # every other URL gets the client-side app, which handles routing.
    location / {
      try_files $uri $uri/index.html /index.csr.html;
    }

    # Hashed bundles never change, so the browser can keep them for a year.
    location ~* \.(?:js|css|woff2?)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }
}
