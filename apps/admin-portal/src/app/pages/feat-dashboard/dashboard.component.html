<h1>Dashboard</h1>

<h2>Theme</h2>
<button
  type="button"
  [attr.aria-pressed]="layout.theme() === 'light'"
  (click)="layout.setTheme('light')"
  >Light</button
>
<button
  type="button"
  [attr.aria-pressed]="layout.theme() === 'dark'"
  (click)="layout.setTheme('dark')"
  >Dark</button
>

<h2>Language</h2>
<button
  type="button"
  [attr.aria-pressed]="layout.language() === 'en'"
  (click)="layout.setLanguage('en')"
  >English</button
>
<button
  type="button"
  lang="de"
  [attr.aria-pressed]="layout.language() === 'de'"
  (click)="layout.setLanguage('de')"
  >Deutsch</button
>

<p *transloco="let t">{{ t('helloWorld') }}</p>
